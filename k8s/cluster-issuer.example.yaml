# cert-managerは `idcf-system` 名前空間にプリインストールされているが、
# 証明書の発行元(ClusterIssuer)はクラスタ管理者側では作成されない
# (Let's EncryptのACMEアカウントはユーザーごとに異なるため)。
# 以下はLet's EncryptのHTTP-01チャレンジを使う一般的な設定例。
# IDCFクラウド固有の推奨設定がある場合はそちらを優先すること
# (この内容は一般的なcert-manager/Kubernetesの知識に基づく例であり、
# IDCFクラウド側のドキュメントで動作確認はしていない)。
#
# 使い方:
#   1. email を実際に通知を受け取れるアドレスに書き換える
#   2. kubectl apply -f k8s/cluster-issuer.example.yaml
#   3. k8s/ingress.yaml の cert-manager.io/cluster-issuer が
#      このmetadata.nameと一致していることを確認
#
# 初回はLet's Encryptの本番発行(件数制限あり)に失敗しても気づきにくいため、
# 先に下記のstaging版で疎通確認してから本番に切り替えることを推奨する。
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: your-email@example.com # 実際の連絡先メールアドレスに置き換える
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: idcf-ilb

---
# 動作確認用(先にこちらで試す場合)。本番用の証明書ではないため
# ブラウザには警告が出るが、発行フロー自体が動くかを確認できる。
# 使う場合は k8s/ingress.yaml の cert-manager.io/cluster-issuer を
# letsencrypt-staging に変更する。
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: your-email@example.com # 実際の連絡先メールアドレスに置き換える
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: idcf-ilb
