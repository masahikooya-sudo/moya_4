# Ingress Controllerを使わず、IDCFクラウドのILB(Infinite LB)で
# このアプリのServiceを直接公開したい場合の代替案
# (通常はIngress経由での公開(ingress.yaml)を推奨。下記コメント参照)。
#
# 使い方: このファイルをコピーしてservice.yamlを上書きするか、
# kustomization.yamlのresourcesからingress.yamlを外し、
# 代わりにこのファイルを追加する。
#
# annotationの `loadbalancer.idcfcloud.com/loadbalancer-class: "ilb"` により、
# 申し込み済みのILBがこのServiceに割り当てられる
# (参考: IDCFクラウド ご利用ガイド「ロードバランサーにILBを利用する」)。
#
# 注意: 実際に確認したクラスタでは、ILBとの連携は独自のIngressClass
# (`idcf-ilb`)経由が正規の方法として用意されていた(ingress.yaml参照)。
# こちらのService直付け方式は未検証のため、まずはingress.yamlの方式を
# 試すことを推奨する。
#
# 注意: この方式はL4(TCP)でのそのまま公開になり、TLS終端が無い。
# GoogleログインにはHTTPSが必須のため、この方式を使う場合は
# ILB側のSSL終端機能で証明書を設定するか、アプリの前段にTLS終端用の
# 別コンポーネントを置く必要がある。証明書取得を自動化したい
# (cert-manager + Let's Encrypt)場合は、ingress.yaml
# (Ingress Controller経由)の方式を推奨する。
apiVersion: v1
kind: Service
metadata:
  name: moya4
  namespace: pii-masking-shield
  annotations:
    loadbalancer.idcfcloud.com/loadbalancer-class: "ilb"
spec:
  selector:
    app: moya4
  ports:
    - name: http
      port: 80
      targetPort: http
  type: LoadBalancer
