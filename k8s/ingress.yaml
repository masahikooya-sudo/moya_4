# IDCFクラウド コンテナには、nginx等の汎用Ingress Controllerではなく、
# 独自のIngressClass(`idcf-ilb`、コントローラーは`idcfcloud.com/idcf-ingress`)
# が用意されている。これを指定するだけでILBとの連携が行われる
# (`kubectl get ingressclass` で確認できる。環境によって名前が異なる
# 可能性があるため、必ず自分のクラスタで確認してから合わせること)。
#
# cert-managerも `idcf-system` 名前空間にプリインストールされているが、
# ClusterIssuer(証明書の発行元)は自分で作成する必要がある
# (`kubectl get clusterissuer` で0件なら未作成)。作成手順は
# k8s/cluster-issuer.example.yaml を参照。
#
# アプリのServiceに直接ILBを紐づける方式(Ingressを使わない)にしたい場合は
# service-loadbalancer.example.yaml を参照。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: moya4
  namespace: pii-masking-shield
  annotations:
    # ClusterIssuerを作成してから有効にする(下記参照)。
    # 未作成の場合はこの行を削除し、証明書を別途用意してtls配下の
    # secretNameに設定するか、暫定的にHTTP公開(tlsブロックごと削除)にする。
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: idcf-ilb
  tls:
    - hosts:
        - masking.example.com # 実際のドメインに置き換える
      secretName: moya4-tls
  rules:
    - host: masking.example.com # 実際のドメインに置き換える(tls配下と同じ値にする)
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: moya4
                port:
                  name: http
