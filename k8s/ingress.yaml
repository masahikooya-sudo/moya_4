# IDCFクラウド コンテナには、nginx等の汎用Ingress Controllerではなく、
# 独自のIngressClass(`idcf-ilb`、コントローラーは`idcfcloud.com/idcf-ingress`)
# が用意されている(`kubectl get ingressclass` で実機確認済み)。これを
# 指定するだけでILBとの連携が行われる(環境によって名前が異なる可能性が
# あるため、必ず自分のクラスタで確認してから合わせること)。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: moya4
  namespace: pii-masking-shield
  annotations:
    # cert-managerを導入済みの場合、ClusterIssuer名に置き換えて有効化する。
    # 未導入の場合はこの行を削除し、証明書を別途用意してtls配下の
    # secretNameに設定するか、暫定的にHTTP公開(tlsブロックごと削除)にする。
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # IDCFクラウドのIngressでTLSを使う場合、事前にコンソールで発行した
    # SSLポリシーのIDをここに指定しないとLBの生成に失敗する
    # (`generateLB failed: ... sslpolicy-id annotation is not found`)。
    ilb.idcfcloud.com/sslpolicy-id: "8d74a56f-3248-43aa-b08b-ee4ad7ab5900"
spec:
  ingressClassName: idcf-ilb
  tls:
    - hosts:
        - masking.pdpro.jp
      secretName: moya4-tls
  rules:
    - host: masking.pdpro.jp
      http:
        paths:
          - path: /
            # IDCFクラウドの独自Ingress用アドミッションWebhook
            # (validate-idcf-ingress.idcfcloud.com)は、pathTypeとして
            # ImplementationSpecific以外(Prefix/Exact)を拒否することを
            # 実機で確認した。標準的なPrefixではなくこちらを使う。
            pathType: ImplementationSpecific
            backend:
              service:
                name: moya4
                port:
                  name: http
