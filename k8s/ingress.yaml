# IDCFクラウド コンテナには、nginx等の汎用Ingress Controllerではなく、
# 独自のIngressClass(`idcf-ilb`、コントローラーは`idcfcloud.com/idcf-ingress`)
# が用意されている。これを指定するだけでILBとの連携が行われる
# (`kubectl get ingressclass` で確認できる。環境によって名前が異なる
# 可能性があるため、必ず自分のクラスタで確認してから合わせること)。
#
# このアプリはVPN接続後にのみアクセスするプライベートなILBを使う運用の
# ため、Let's Encrypt(cert-manager)による自動証明書発行は使わない
# (HTTP-01検証はインターネット側からの到達性が必要で、プライベートILB
# では検証できない)。代わりに、既存の *.pdpro.jp ワイルドカード証明書を
# 手動でSecretとして登録する(下記の「証明書Secretの作成」参照)。
#
# また、IDCFクラウドのIngressコントローラーはTLSを使う場合、
# `ilb.idcfcloud.com/sslpolicy-id` でSSLポリシーのIDを指定することを
# 必須としている(実機で確認: 未指定だと "generateLB failed" エラーになる)。
# IDCFクラウドのコンソールでSSLポリシーを作成し、そのIDを下記に設定すること。
#
# アプリのServiceに直接ILBを紐づける方式(Ingressを使わない)にしたい場合は
# service-loadbalancer.example.yaml を参照。
#
# --- 証明書Secretの作成(cert-managerを使わない場合) ---
#   kubectl create secret tls moya4-tls \
#     --namespace pii-masking-shield \
#     --cert=path/to/pdpro.jp.crt \
#     --key=path/to/pdpro.jp.key
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: moya4
  namespace: pii-masking-shield
  annotations:
    # IDCFクラウドのコンソールで作成したSSLポリシーのIDに置き換える。
    ilb.idcfcloud.com/sslpolicy-id: "REPLACE_WITH_YOUR_SSLPOLICY_ID"
spec:
  ingressClassName: idcf-ilb
  tls:
    - hosts:
        - masking.pdpro.jp
      secretName: moya4-tls
  rules:
    - host: masking.pdpro.jp
      http:
        paths:
          - path: /
            # IDCFクラウドの独自Ingress用アドミッションWebhook
            # (validate-idcf-ingress.idcfcloud.com)は、pathTypeとして
            # ImplementationSpecific以外(Prefix/Exact)を拒否することを
            # 実機で確認した。標準的なPrefixではなくこちらを使う。
            pathType: ImplementationSpecific
            backend:
              service:
                name: moya4
                port:
                  name: http
