apiVersion: v1
kind: ConfigMap
metadata:
  name: moya4-config
  namespace: pii-masking-shield
data:
  # 使用するspaCy日本語モデル。精度重視ならja_core_news_lg(既定)、
  # 動作確認や省メモリ環境ならja_core_news_smに変更できる。
  SPACY_MODEL: "ja_core_news_lg"
  SCORE_THRESHOLD: "0.35"
  MAX_UPLOAD_SIZE: "20971520"
  AUDIT_LOG_DIR: "/app/logs"
  AUDIT_LOG_BACKUP_COUNT: "90"
  AUDIT_LOG_RAW_INPUT: "true"
  AUTH_ENABLED: "true"
  # ログインを許可するGoogle Workspaceドメイン。
  GOOGLE_ALLOWED_DOMAIN: "pdpro.jp"
  # ドメイン/Ingressを使わず、ILBに直接HTTP(ポート8000)でアクセスする
  # 構成のため false。TLS終端(ドメイン+Ingress+cert-manager等)を使う
  # 構成に変更した場合は、セッションCookieにSecure属性を付与するため
  # trueに変更すること。
  SESSION_HTTPS_ONLY: "false"
