# このファイルはテンプレートです。このままでは使えません。
# コピーして secret.yaml 等の名前にし、値を実際のものに書き換えてから
# kubectl apply -f してください(secret.yaml は .gitignore 済みなので
# 誤ってコミットされません)。
#
# もしくは、ファイルを作らず以下のように imperative コマンドで
# 直接作成することを推奨します(手元に平文のSecretマニフェストを
# 残さずに済むため):
#
#   kubectl create secret generic moya4-secrets \
#     --namespace pii-masking-shield \
#     --from-literal=GOOGLE_CLIENT_ID='xxxxxxxx.apps.googleusercontent.com' \
#     --from-literal=GOOGLE_CLIENT_SECRET='xxxxxxxx' \
#     --from-literal=SESSION_SECRET_KEY="$(openssl rand -hex 32)"
#
apiVersion: v1
kind: Secret
metadata:
  name: moya4-secrets
  namespace: pii-masking-shield
type: Opaque
stringData:
  GOOGLE_CLIENT_ID: "xxxxxxxx.apps.googleusercontent.com"
  GOOGLE_CLIENT_SECRET: "xxxxxxxx"
  # openssl rand -hex 32 等で生成した固定値を設定する。
  # 未設定/毎回変わる値だと、Pod再起動のたびに全ユーザーが
  # 再ログインを求められる。
  SESSION_SECRET_KEY: "REPLACE_WITH_OUTPUT_OF: openssl rand -hex 32"
