# ドメイン名+Ingress(TLS終端はcert-manager等)経由で公開したい場合の
# 代替案。使い方: このファイルをservice.yamlとして上書きし、
# kustomization.yamlのresourcesに ingress.yaml を追加する
# (現在の既定は service.yaml による直接ILB公開・ポート8000)。
apiVersion: v1
kind: Service
metadata:
  name: moya4
  namespace: pii-masking-shield
spec:
  selector:
    app: moya4
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
