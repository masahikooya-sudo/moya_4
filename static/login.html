<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ログイン - PII Masking Shield</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .login-card {
    width: 100%;
    max-width: 380px;
    text-align: center;
  }
  .login-card .logo {
    width: 56px;
    height: 56px;
    margin: 0 auto 18px;
    font-size: 1.7rem;
  }
  .login-card h1 {
    font-size: 1.3rem;
    margin: 0 0 6px;
  }
  .login-card p.subtitle {
    margin-bottom: 26px;
  }
  .google-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    background: #fff;
    color: #1f1f1f;
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 12px 18px;
    font-size: 0.95rem;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
  }
  .google-btn:hover {
    opacity: 0.9;
  }
  .login-error {
    margin-top: 18px;
    display: none;
  }
</style>
</head>
<body>
  <div class="login-wrap">
    <div class="card login-card">
      <div class="logo">🛡️</div>
      <h1>PII Masking Shield</h1>
      <p class="subtitle">許可されたGoogleアカウントでログインしてください</p>

      <a class="google-btn" href="/auth/login">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.9-2.26 5.36-4.78 7.02l7.73 6c4.51-4.18 7.09-10.36 7.09-17.49z"/>
          <path fill="#FBBC05" d="M10.53 28.59A14.5 14.5 0 0 1 9.5 24c0-1.59.27-3.13.76-4.59l-7.98-6.19A23.94 23.94 0 0 0 0 24c0 3.87.92 7.53 2.56 10.78z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.9l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        <span>Googleでログイン</span>
      </a>

      <p id="login-error" class="login-error error-box">
        アクセスが許可されていないアカウントです。許可されたドメインのGoogleアカウントでログインしてください。
      </p>
    </div>
  </div>

  <script>
    if (new URLSearchParams(window.location.search).get("error") === "forbidden") {
      document.getElementById("login-error").style.display = "block";
    }
  </script>
</body>
</html>
