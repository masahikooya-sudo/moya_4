services:
  masking-tool:
    build:
      context: .
      args:
        SPACY_MODEL: ${SPACY_MODEL:-ja_core_news_lg}
    ports:
      - "8000:8000"
    environment:
      - SPACY_MODEL=${SPACY_MODEL:-ja_core_news_lg}
      - SCORE_THRESHOLD=${SCORE_THRESHOLD:-0.35}
      - AUDIT_LOG_RAW_INPUT=${AUDIT_LOG_RAW_INPUT:-true}
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_ALLOWED_DOMAIN=${GOOGLE_ALLOWED_DOMAIN:-pdpro.jp}
      - SESSION_SECRET_KEY=${SESSION_SECRET_KEY}
      - SESSION_HTTPS_ONLY=${SESSION_HTTPS_ONLY:-false}
    volumes:
      - ./logs:/app/logs
